name: Changelog Release Guard

on:
  push:
    tags:
      - "*"

jobs:
  verify-changelog-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure changelog contains a release section for this tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          NORMALIZED_TAG="${TAG#v}"

          if grep -Fq "## [${TAG}]" CHANGELOG.md || grep -Fq "## [${NORMALIZED_TAG}]" CHANGELOG.md; then
            echo "Found release section for tag ${TAG} in CHANGELOG.md"
            exit 0
          fi

          echo "ERROR: Missing changelog release section for tag ${TAG}."
          echo "Add a heading like: ## [${NORMALIZED_TAG}] - YYYY-MM-DD"
          exit 1
